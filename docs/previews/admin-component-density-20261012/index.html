</style></head><body><header><span class="status">已上线 · 4f30c3e</span><h1>后台紧凑组件预览</h1><p>保留现有配色、卡片与导航，重点减少重复的竖向空间。</p></header><main><div class="rules"><span>统计：标签与数字横排</span><span>名称：最多 1–2 行，点击看全文</span><span>说明：按需展开，确认步骤保留</span></div><div class="toolbar"><button id="mobile" class="active" aria-pressed="true">手机 390px</button><button id="desktop" aria-pressed="false">电脑 1440px</button><a href="/ui-preview-original/">上次 44 组预览</a></div><div class="grid" id="grid"></div><p class="note">截图来自实际组件与项目 CSS，全部使用本地合成数据。交互工作区不会连接生产数据库；预检返回固定示例。物理 iPhone、Safari 软键盘与真实业务交易尚未验收。</p></main><dialog id="detail" class="detail"><div class="detailbar"><strong id="title"></strong><button id="before">修改前</button><button id="after">修改后</button><button id="compare">前后对照</button><button id="full">完整名称</button><button id="demo">试操作</button><button id="close" aria-label="关闭组件预览">关闭</button></div><p id="help" class="help"></p><div id="canvas" class="canvas"></div></dialog><script>
const cards=[{"id": "inventory", "title": "库存统计与体检", "description": "8 项统计改为两组横排摘要，体检 4 项保留两列。", "metric": "8 项 160px · 体检 62px", "workspace": "/admin?panel=catalog&catalogView=sold-shortages&locale=zh-CN", "shots": {"mobile": {"after": {"path": "screens/inventory-after-mobile.png", "sha256": "4b1d16eaaa67c53a7ee2c53577109ca26e6ec2748f3eb8d948e47ff5a865a73c"}, "before": {"path": "screens/inventory-before-mobile.png", "sha256": "366285cd71257137756f874f48dcf566125bca5cfaf46c7daacc0f3593c07e96"}}, "desktop": {"after": {"path": "screens/inventory-after-desktop.png", "sha256": "217fe3a981203cb09561b4e42d2ff2823db87db0af62bd1b3e63053c88b974fe"}, "before": {"path": "screens/inventory-before-desktop.png", "sha256": "1bd16b351e7ef27e173da0032383d7039fa77ed0156d5627ca49010de09725e3"}}}}, {"id": "rma", "title": "售后详情", "description": "商品名最多两行，客户名一行；点击名称旁的展开图标查看全文。", "metric": "身份信息 193px", "workspace": "/admin?panel=rma&locale=zh-CN", "shots": {"mobile": {"after": {"path": "screens/rma-after-mobile.png", "sha256": "4049f4c16231acb0c6f69607c25ec498f765a841f6a4c5e1a7c3eae206e285b1"}, "before": {"path": "screens/rma-before-mobile.png", "sha256": "b11fc5d2627d500d4a70f1e3da326dd641a122511393ef539071bb14aaae066d"}, "full": {"path": "screens/rma-full-mobile.png", "sha256": "03ec0a630e650387bbda26975f595c8ddb257453d508dc6d52e1b5379012ac11"}}, "desktop": {"after": {"path": "screens/rma-after-desktop.png", "sha256": "87150e00abfc438e767e35e9d422e9c378567eae675b5cc0a9105a433402e058"}, "before": {"path": "screens/rma-before-desktop.png", "sha256": "7640d67e556824d101b982ba617b30d3c9895f442582b1962da281d0f214e00a"}, "full": {"path": "screens/rma-full-desktop.png", "sha256": "811f2c53ebadfcb74027098646b7a9ffaa7f5082f5b2f4591fbde00ec82ee200"}}}}, {"id": "excel", "title": "Excel 导入预检", "description": "标题和当前步骤合并，7 项统计改为紧凑摘要，说明按需展开。", "metric": "标题 77px · 7 项 122px", "workspace": "/admin?panel=catalog&locale=zh-CN", "shots": {"mobile": {"after": {"path": "screens/excel-after-mobile.png", "sha256": "a74c743f58d37fbe8398ed16c283966055beca20f62a169acb5621901cc6596a"}, "before": {"path": "screens/excel-before-mobile.png", "sha256": "6ee5316b2604c3219fe57b72f13a78cc3c3eb66b371dfb930454519b86f82c23"}, "full": {"path": "screens/excel-confirmed-mobile.png", "sha256": "672c5ee50de4e0870a7a0e6dcde0c594ba8cd2f3241c3c20b1b24d4699460e99"}}, "desktop": {"after": {"path": "screens/excel-after-desktop.png", "sha256": "b4b904f4a3b4643ef2c660c5d6c9c10a571f17c31b539be360ec46aca3c08c34"}, "before": {"path": "screens/excel-before-desktop.png", "sha256": "fcf504f6a2aff10e1cef69e14fcdd5fcc6c8d33608323ff910ce3f32890cabe7"}, "full": {"path": "screens/excel-confirmed-desktop.png", "sha256": "651bf65da9558264c47f173e4cd6adac04a28d6a905abdf5e4e87b53ef6227a7"}}}}, {"id": "finance", "title": "财务摘要", "description": "标签与完整金额横排；大金额自动改为单列，保留币种和百分比。", "metric": "正常摘要 137px", "workspace": "/admin?panel=finance&locale=zh-CN", "shots": {"mobile": {"after": {"path": "screens/finance-after-mobile.png", "sha256": "483f2c86db568873f290e60d052e4fe0b851ccf53214db21a7c2176439ea97b6"}, "before": {"path": "screens/finance-before-mobile.png", "sha256": "61079a20431da8a21ea810c32a6f0ed440b6200de2875900c80ae41b2cfbcc17"}}, "desktop": {"after": {"path": "screens/finance-after-desktop.png", "sha256": "b13e0277ec4f4e0669d23c1b4f1a19fd10a9a5374575579cacc132f656d64bfe"}, "before": {"path": "screens/finance-before-desktop.png", "sha256": "8f53dc0b66eac43f6ebe852eb76a94e3b773b24782a7ffa553e5024ab7f009a3"}}}}, {"id": "overview", "title": "经营概览", "description": "手机端 6 项指标集中呈现，统计口径和原对比数据按需展开。", "metric": "6 项约 92–103px", "workspace": "/admin?panel=overview&locale=zh-CN", "shots": {"mobile": {"after": {"path": "screens/overview-after-mobile.png", "sha256": "082c184213a22496e9f1d3c6b40d91cf1ca7e4dc56c2615e2dea3f7c47620160"}, "before": {"path": "screens/overview-before-mobile.png", "sha256": "c3349c67e174b5ca01cbdc5a8a4a1b6a758693f2238e01d5a2d716f8afeeed53"}}, "desktop": {"after": {"path": "screens/overview-after-desktop.png", "sha256": "94950b8c3c2ccc243fa82af4af4db32fe424347c03d3ce7f02301c63c353d196"}, "before": {"path": "screens/overview-before-desktop.png", "sha256": "90c342e5040b1b20758c7757f95753c6792d454d661d0a69e951706478e43c73"}}}}, {"id": "analytics", "title": "访问分析", "description": "4 项指标使用同一摘要排版，指标说明集中折叠。", "metric": "4 项约 76–92px", "workspace": "/admin?panel=analytics&locale=zh-CN", "shots": {"mobile": {"after": {"path": "screens/analytics-after-mobile.png", "sha256": "5aa6a7fe822f3572512d789ffe6d58aef833aeb71330548ed86e540a557bcac7"}, "before": {"path": "screens/analytics-before-mobile.png", "sha256": "27da33deaee8355a529bc822ee8156f065cbb9c259634fc64d293e66516876ff"}}, "desktop": {"after": {"path": "screens/analytics-after-desktop.png", "sha256": "96ffc133e15d9af6e2a1b337d3a7ce6e945e1942409e5c24bc3f672b8beecc48"}, "before": {"path": "screens/analytics-before-desktop.png", "sha256": "96ffc133e15d9af6e2a1b337d3a7ce6e945e1942409e5c24bc3f672b8beecc48"}}}}, {"id": "product", "title": "商品详情名称", "description": "详情名称最多两行，原查看和编辑入口继续保留。", "metric": "复用名称展开", "workspace": "/admin?panel=catalog&locale=zh-CN", "shots": {"mobile": {"after": {"path": "screens/product-after-mobile.png", "sha256": "f4121cd9690d5e95f5448781bf0e84ac05d9ef110f513771943c32c3fe37cc26"}, "full": {"path": "screens/product-full-mobile.png", "sha256": "2980aebf468e0a6c49459527d42cba7a81c44d20b6df01fa4449c2bfef24c8f2"}}, "desktop": {"after": {"path": "screens/product-after-desktop.png", "sha256": "176bbf38674d47a4cee6729c2a5f9597a6ba80fa2f5c82c217c15631b7591d75"}, "full": {"path": "screens/product-full-desktop.png", "sha256": "0d9748f3dea9bc203e9017a30529b0c9e3a705e15d59b05412e94e878afc62eb"}}}}, {"id": "batch", "title": "到货批次商品名称", "description": "限制名称列宽，超长名称可展开，不挤占数量与成本列。", "metric": "复用名称展开", "workspace": "/admin?panel=catalog&catalogView=batches&locale=zh-CN", "shots": {"mobile": {"after": {"path": "screens/batch-after-mobile.png", "sha256": "f41dc9942450429fb529b348096fa585edd89732672e3f69619f65cf53e10d28"}, "full": {"path": "screens/batch-full-mobile.png", "sha256": "d20092200c9d738d60303c7f7af0059591f0a7bbc50a2050c22b0ecef6c12635"}}, "desktop": {"after": {"path": "screens/batch-after-desktop.png", "sha256": "f9a1a92b6dd9902623bfd9afa7ec22a43d33cb5745a6e1f0b871daba3bbe86be"}, "full": {"path": "screens/batch-full-desktop.png", "sha256": "13fa9b154b4dfde6340dcd76bf8e03b9b1f718185610a5149d47538a6b3e2d42"}}}}, {"id": "remax", "title": "REMAX 到货名称", "description": "到货商品名一行摘要，点击查看全文，数量输入继续完整显示。", "metric": "复用名称展开", "workspace": "/admin?panel=remax&locale=zh-CN", "shots": {"mobile": {"after": {"path": "screens/remax-after-mobile.png", "sha256": "e66af694ea2c9d695ed5a71f2410f1614899197f503aa54791e59c2b634f8b65"}, "before": {"path": "screens/remax-before-mobile.png", "sha256": "33a36a64cea69563751e545f43fbc180de5eef6692d0fdedfef714c3f731f088"}, "full": {"path": "screens/remax-full-mobile.png", "sha256": "f72ade05c96415eb0e60298abae5f9209c927c0fb486c231a7e26a0d2edec9af"}}, "desktop": {"after": {"path": "screens/remax-after-desktop.png", "sha256": "3ee8d8822d276f4f250db0d7681f06bcdb5f0d12fb16181052653962a8896153"}, "before": {"path": "screens/remax-before-desktop.png", "sha256": "fe87778550ad13013e84a7488ad1529f522a9de934cdd6d2e8a2911d3efa395d"}, "full": {"path": "screens/remax-full-desktop.png", "sha256": "4e35c7d23b91bc29d2aca65f2b4671700e50d06f7eafccc62e1839ef745f5f10"}}}}];let device='mobile',selected=null,view='after';const $=id=>document.getElementById(id);const guides={inventory:'库存：点击体检或补货记录中的长名称可查看全文。',rma:'售后：打开第一条申请，再点击商品名或客户名查看全文。',excel:'导入：打开 Excel 导入 → 粘贴表格 → 输入 sku,name 示例 → 生成导入预览。预检返回固定合成示例。',product:'商品：打开更多商品操作 → 商品详情。短名称直接显示；实际超出两行时可展开。',batch:'批次：打开「查看明细」，在商品行点击超长名称。',remax:'REMAX：选择到货批次，再点击到货行的名称。此工作区不会提交实际到货。'};
function render(){ $('grid').replaceChildren();for(const c of cards){const article=document.createElement('article');article.className='card';const meta=document.createElement('div');meta.className='meta';const heading=document.createElement('h2');heading.textContent=c.title;const p=document.createElement('p');p.textContent=c.description;const metric=document.createElement('div');metric.className='metric';metric.textContent=c.metric;meta.append(heading,p,metric);const thumb=document.createElement('button');thumb.className='thumb'+(device==='desktop'?' desktop':'');thumb.setAttribute('aria-label','预览 '+c.title+' 修改后');const img=document.createElement('img');img.src=c.shots[device].after.path;img.alt=c.title+' 修改后';img.loading='lazy';thumb.append(img);thumb.onclick=()=>open(c,'after');const actions=document.createElement('div');actions.className='actions';const compare=document.createElement('button');compare.textContent=c.shots[device].before?'前后对照':'查看详情';compare.onclick=()=>open(c,c.shots[device].before?'compare':'after');const demo=document.createElement('button');demo.textContent='试操作';demo.onclick=()=>open(c,'demo');actions.append(compare,demo);article.append(meta,thumb,actions);$('grid').append(article);}}
function open(c,mode){selected=c;view=mode;draw();$('detail').showModal();}
function addImage(shot,caption,parent){const img=document.createElement('img');img.src=shot.path;img.alt=selected.title+' '+caption;parent.append(img);}
function draw(){const shots=selected.shots[device];$('title').textContent=selected.title+' · '+(device==='mobile'?'手机':'电脑');$('before').disabled=!shots.before;$('compare').disabled=!shots.before;$('full').hidden=!shots.full;$('full').textContent=selected.id==='excel'?'确认门禁示例':'完整名称';for(const mode of ['before','after','compare','full','demo'])$(mode).classList.toggle('active',view===mode);const canvas=$('canvas');canvas.replaceChildren();$('help').textContent=view==='demo'?(guides[selected.id]||'使用顶部入口和原页面控件试操作，以下为本地合成数据。'):selected.description;if(view==='demo'){const frame=document.createElement('iframe');frame.src=selected.workspace;frame.title=selected.title+' 交互工作区';frame.style.width=(device==='mobile'?390:1440)+'px';canvas.append(frame);}else if(view==='compare'){const pair=document.createElement('div');pair.className='compare';for(const [key,label] of [['before','修改前'],['after','修改后']]){const figure=document.createElement('figure');const caption=document.createElement('figcaption');caption.textContent=label;figure.append(caption);addImage(shots[key],label,figure);pair.append(figure);}canvas.append(pair);}else addImage(shots[view]||shots.after,view,canvas);}
for(const mode of ['before','after','compare','full','demo'])$(mode).onclick=()=>{view=mode;draw();};$('close').onclick=()=>{$('detail').close();$('canvas').replaceChildren();};$('detail').addEventListener('close',()=>$('canvas').replaceChildren());for(const mode of ['mobile','desktop'])$(mode).onclick=()=>{device=mode;for(const key of ['mobile','desktop']){$(key).classList.toggle('active',key===mode);$(key).setAttribute('aria-pressed',String(key===mode));}render();};render();
</script></body></html>
